name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Moment-android.zip
      - run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> Moment/gradle.properties
      - run: |
          sed -i 's|actionStartActivity<MainActivity>()|actionStartActivity(android.content.Intent(context, MainActivity::class.java))|' Moment/app/src/main/java/app/moment/Widget.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
        working-directory: Moment
      - uses: actions/upload-artifact@v4
        with:
          name: Moment-debug-apk
          path: Moment/app/build/outputs/apk/debug/*.apk
